[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "creatorcut"
version = "0.1.0"
description = "Explainable multimodal ranking for creator video clips"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "av>=18,<19",
  "faster-whisper==1.2.1",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]
semantic = [
  "huggingface-hub>=0.34,<2",
  "onnxruntime>=1.22,<2",
  "tokenizers>=0.21,<1",
]

[project.scripts]
creatorcut-validate = "creatorcut.dataset:main"
creatorcut-transcribe = "creatorcut.transcription:main"
creatorcut-validate-transcripts = "creatorcut.transcript_validation:main"
creatorcut-build-dataset = "creatorcut.dataset:build_dataset_main"
creatorcut-generate-candidates = "creatorcut.candidates:generate_main"
creatorcut-evaluate-candidates = "creatorcut.candidates:evaluate_main"
creatorcut-sample-annotations = "creatorcut.sampling:main"
creatorcut-annotate = "creatorcut.annotation_app:main"
creatorcut-score-baselines = "creatorcut.baseline:score_main"
creatorcut-evaluate-baselines = "creatorcut.baseline:evaluate_main"
creatorcut-build-training-data = "creatorcut.training:build_main"
creatorcut-train-ridge = "creatorcut.training:train_main"
creatorcut-encode-transcripts = "creatorcut.semantic:encode_main"
creatorcut-evaluate-semantic = "creatorcut.semantic:evaluate_main"
creatorcut-extract-audio = "creatorcut.audio:extract_main"
creatorcut-evaluate-audio = "creatorcut.audio:evaluate_main"
creatorcut-score-holdout = "creatorcut.holdout:score_main"
creatorcut-evaluate-holdout = "creatorcut.holdout:evaluate_main"
creatorcut-report-holdout = "creatorcut.holdout_report:main"
creatorcut-train-pairwise = "creatorcut.ranking:main"
creatorcut-analyze-failures = "creatorcut.failure_analysis:main"
creatorcut-review-failures = "creatorcut.failure_app:main"
creatorcut-refine-boundaries = "creatorcut.boundary_refinement:main"
creatorcut-train-boundaries = "creatorcut.boundary_learning:main"
creatorcut-evaluate-semantic-boundaries = "creatorcut.boundary_semantic:main"
creatorcut-build-v2-development = "creatorcut.v2_development:main"
creatorcut-report-v2-development = "creatorcut.v2_report:main"
creatorcut-inspect-media = "creatorcut.media:main"
creatorcut-web = "creatorcut.product_app:main"
creatorcut-worker = "creatorcut.product_worker:main"
creatorcut-export-feedback = "creatorcut.feedback_export:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
creatorcut = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:'cgi' is deprecated.*:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
